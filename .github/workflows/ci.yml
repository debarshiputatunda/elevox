name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: '3306'
      DB_NAME: elevox_test
      DB_USER: test
      DB_PASSWORD: test-only
      SECRET_KEY: ci-only-not-a-deployment-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
        working-directory: elebox_backend
      - run: python -m pytest -q
        working-directory: elebox_backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: elebox_frontend/package-lock.json
      - run: npm ci
        working-directory: elebox_frontend
      - run: npm test && npm run build
        working-directory: elebox_frontend
  firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++11 firmware/tests/alarm_logic_test.cpp -o /tmp/alarm-test && /tmp/alarm-test
      - run: g++ -std=c++11 firmware/tests/wifi_settings_test.cpp -o /tmp/wifi-test && /tmp/wifi-test
      - run: g++ -std=c++11 firmware/tests/v6_sensing_test.cpp -o /tmp/v6-test && /tmp/v6-test
      - run: g++ -std=c++11 firmware/tests/v6_network_test.cpp -o /tmp/network-test && /tmp/network-test
      - run: g++ -std=c++11 firmware/tests/v6_threshold_test.cpp -o /tmp/threshold-test && /tmp/threshold-test
      - run: g++ -std=c++11 firmware/tests/v6_tuning_test.cpp -o /tmp/tuning-test && /tmp/tuning-test
      - run: g++ -std=c++11 firmware/tests/v6_calibration_test.cpp -o /tmp/calibration-test && /tmp/calibration-test
      - run: g++ -std=c++11 firmware/tests/v6_preferences_test.cpp -o /tmp/preferences-test && /tmp/preferences-test
      - run: g++ -std=c++11 firmware/tests/v7_sensing_test.cpp -o /tmp/v7-sensing-test && /tmp/v7-sensing-test
      - run: g++ -std=c++11 firmware/tests/v7_settings_test.cpp -o /tmp/v7-settings-test && /tmp/v7-settings-test
      - run: g++ -std=c++11 firmware/tests/v7_mode_transition_test.cpp -o /tmp/v7-transition-test && /tmp/v7-transition-test
